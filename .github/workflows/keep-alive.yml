name: Keep API awake
# Render's free tier spins the backend down after ~15 min without inbound traffic, and the next
# request then waits 30-60s for a cold start. Pinging the health endpoint every 10 minutes keeps
# it warm. One always-on service fits inside the free tier's 750 instance-hours/month.
# Note: GitHub may delay scheduled runs at busy times, and disables them after 60 days without
# repository activity (re-enable from the Actions tab).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://novalearn-ue6u.onrender.com/actuator/health
