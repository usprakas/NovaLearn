name: novalearn_mobile
description: NovaLearn child learning and parent progress companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  # Bundled locally rather than fetched at runtime via the google_fonts package — a child on a
  # restricted or slow network (school wifi, a content filter, a flaky connection) shouldn't have
  # the app's typography (or worse, perceived "is this loading at all") depend on reaching
  # fonts.gstatic.com. Variable fonts: Flutter picks the matching named instance within the one
  # file for each declared weight. OFL.txt alongside each — required by the Open Font License when
  # redistributing (SIL OFL 1.1, both fonts).
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#6246EA"
    theme_color: "#6246EA"
